name: Build

# Runs on every push and PR to main, plus a manual "Run workflow" button.
# The Windows job is the one that matters for testing: it produces a real
# native (MSVC) OpenPaint.exe you can download from the Actions run page on
# your Windows/tablet machine — no toolchain needed on Windows.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Fast correctness gate on Linux: check, test, fmt, clippy. Cheap and quick.
  linux-check:
    name: Check & test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # winit needs these system libs to build on Linux CI.
      - name: Install Linux GUI deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  # The important one: build the downloadable Windows .exe.
  windows-build:
    name: Build Windows .exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Lint the Windows-specific code (e.g. the pen backend) that the Linux
      # job can't see because it's #[cfg(windows)].
      - name: Clippy (Windows)
        run: cargo clippy --bin openpaint -- -D warnings

      - name: Build (release)
        run: cargo build --release --bin openpaint

      - name: Upload OpenPaint.exe
        uses: actions/upload-artifact@v5
        with:
          name: OpenPaint-windows-x86_64
          path: target/release/openpaint.exe
          if-no-files-found: error
