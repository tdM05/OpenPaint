[workspace]
resolver = "2"
members = [
    "crates/openpaint-core",
    "crates/openpaint-file",
    "crates/openpaint-text",
    "crates/openpaint-app",
]

# `debug_assert_with_mut_call` catches side effects inside `debug_assert!`, which vanish
# in a release build (DECISIONS 11a.6). Note its reach is narrower than the hazard: it
# fires on `&mut` *arguments*, not on a mutating method receiver, so it would **not** have
# caught `debug_assert!(map.insert(k, v).is_none())`. Kept because the shapes it does
# catch are the same mistake; the actual guard for that hazard is `cargo test --release`
# in CI.
[workspace.lints.clippy]
debug_assert_with_mut_call = "deny"

[workspace.package]
# **0.1.0: the first release.** Not 1.0, and the number is the honest part -- what is here is a
# painting application an artist can do a whole job in, and `docs/TODO.md` §4 is the list of what
# it still cannot do. See CHANGELOG.md.
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/tdM05/OpenPaint"

# Faster release builds are worth it for an interactive app; tune later.
[profile.release]
opt-level = 3
lto = "thin"
