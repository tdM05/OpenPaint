[package]
name = "openpaint-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "OpenPaint desktop application shell (window + UI). Thin layer over openpaint-core."

[[bin]]
name = "openpaint"
path = "src/main.rs"

[dependencies]
openpaint-core = { path = "../openpaint-core" }
openpaint-file = { path = "../openpaint-file" }
# Text layout and glyph rasterization. The app never talks to a font library directly -- this
# crate is the seam, so swapping the text stack cannot reach anything here.
openpaint-text = { path = "../openpaint-text" }
winit = "0.30"
# GPU rendering. wgpu 22 is compatible with winit 0.30 and auto-selects a
# backend at runtime (D3D12/Vulkan on Windows, Vulkan on Linux).
wgpu = "22"
# Block on wgpu's async setup calls without pulling in a full async runtime.
pollster = "0.3"
# Safe casting of plain-old-data structs to bytes for GPU uploads.
bytemuck = { version = "1", features = ["derive"] }
# Half-precision floats, to build Rgba16Float upload buffers matching the tile
# format in openpaint-core.
half = { version = "2", features = ["bytemuck"] }
# Throwaway debug UI for engine work (DECISIONS section 3: the real CSP-like UI is
# a later, deliberately reversible decision). Pinned to the 0.29 line because that
# is what targets wgpu 22 / winit 0.30 -- a mismatch duplicates wgpu and the types
# stop lining up.
# PNG export, and PNG import. `png` rather than `image`: `image` pulls a dozen formats and their
# decoders, and the two we actually need are the two below.
png = "0.18"
# JPEG import. A scanned pencil sketch is a JPEG far more often than it is a PNG -- the format
# every phone camera and every scanner driver reaches for -- so an importer that reads only PNG
# would miss the commonest way a comics page starts. `jpeg-decoder` is the decoder `image` itself
# uses, without the rest of `image`.
jpeg-decoder = "0.3"
# The system clipboard. Copy and paste have to cross the application's edge or they are not copy
# and paste: a reference pasted from a browser and a panel pasted into a message are both the
# point. Rust has no clipboard in its standard library and every platform's is different, which
# is precisely the kind of thing to take a crate for.
arboard = "3"
egui = "0.29"
egui-wgpu = "0.29"
egui-winit = { version = "0.29", default-features = false }
rfd = "0.17"
# The OS-designated per-user data directory, for crash-recovery copies. Recovery files must not
# live next to the document: that folder may be read-only, on removable media, or synced.
dirs = "6"
# The brush library is JSON in the data directory -- see `presets.rs` for why not SQLite.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "windows")'.dependencies]
# Native tablet/pen input (Windows Ink) behind our InputBackend trait. Windows-
# only for now; the mouse backend covers other platforms until we add theirs.
octotablet = "0.1"

[lints]
workspace = true
